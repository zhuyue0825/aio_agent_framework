name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm test
      - run: npm run build

  frontend-e2e:
    name: Frontend Playwright flow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  python:
    name: Python contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - run: python -m compileall -q agent_framework backend
      - run: python -m pytest -q backend/tests

  java:
    name: Java build and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-service
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-database-password-not-a-secret
      REDIS_PASSWORD: ci-redis-password-not-a-secret
      AIO_JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      INTERNAL_SERVICE_TOKEN: ci-internal-token-with-at-least-thirty-two-characters
      AIO_BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      AIO_WORKSPACE_HOST_PATH: ./workspaces
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
