x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - aio-agent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aio_agent}
      POSTGRES_USER: ${POSTGRES_USER:-aio_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aio-agent-postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/rotate-password.sql:/opt/aio/rotate-password.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  postgres-backup:
    build:
      context: ./ops/postgres-backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-aio_agent}
      PGUSER: ${POSTGRES_USER:-aio_agent}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - aio-agent-postgres-backups:/backups
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /backups/.last-success &&
          age=$$(($$(date +%s)-$$(cat /backups/.last-success))) &&
          test $$age -lt $${POSTGRES_BACKUP_MAX_AGE_SECONDS:-172800}
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 2m

  aio-sandbox:
    image: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          nc -z localhost $${SANDBOX_SRV_PORT} &&
          ([ "$${DISABLE_BROWSER}" = "true" ] || nc -z localhost $${BROWSER_REMOTE_DEBUGGING_PORT})
      interval: 10s
      timeout: 5s
      retries: 8

  minimind:
    profiles: [local-model]
    build:
      context: ./ops/minimind
    restart: unless-stopped
    init: true
    logging: *default-logging
    environment:
      OMP_NUM_THREADS: ${MINIMIND_CPU_THREADS:-4}
    command: ["python", "serve_openai_api.py", "--weight", "${MINIMIND_WEIGHT:-full_sft}", "--lora_weight", "${MINIMIND_LORA_WEIGHT:-None}", "--device", "cpu"]
    volumes:
      - ${MINIMIND_WEIGHTS_HOST_PATH:-./minimind/out}:/opt/minimind/out:ro
    read_only: true
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8998/docs', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 3m
    stop_grace_period: 20s

  minimind-94m:
    profiles: [extra-models]
    build:
      context: ./ops/minimind
    restart: unless-stopped
    init: true
    logging: *default-logging
    environment:
      OMP_NUM_THREADS: ${MINIMIND_94M_CPU_THREADS:-4}
    command: ["python", "serve_openai_api.py", "--weight", "autodl-93m/full_sft_12l", "--num_hidden_layers", "12", "--device", "cpu"]
    volumes:
      - ${MINIMIND_WEIGHTS_HOST_PATH:-./minimind/out}:/opt/minimind/out:ro
    read_only: true
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=1770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8998/docs', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 3m
    stop_grace_period: 20s

  agent-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      AIO_SANDBOX_URL: http://aio-sandbox:8080
      AIO_ALLOWED_WORKSPACE_ROOTS: /workspaces
      MODEL_PROVIDER: ${MODEL_PROVIDER:-remote}
      MODEL_API_BASE: ${MODEL_API_BASE:-https://api.deepseek.com}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-deepseek-v4-flash}
      LOCAL_MODEL_API_BASE: ${LOCAL_MODEL_API_BASE:-http://minimind:8998/v1}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-minimind}
      MINIMIND_94M_API_BASE: ${MINIMIND_94M_API_BASE:-http://minimind-94m:8998/v1}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-3}
      MODEL_SETTINGS_PATH: /app/data/model-settings.json
      MODEL_SCAN_ROOTS: /models/minimind:/models/huggingface
      MODEL_REGISTRY_MANIFEST: /app/backend/model-registry.default.json
      MODEL_RUNTIME_ENDPOINTS: ${MODEL_RUNTIME_ENDPOINTS:-}
      MODEL_REGISTRY_CACHE_SECONDS: ${MODEL_REGISTRY_CACHE_SECONDS:-5}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      AIO_REDIS_KEY_PREFIX: ${AIO_REDIS_KEY_PREFIX:-aio}
      AIO_MULTI_TENANT_WORKSPACES: "true"
      MODEL_REMOTE_ALLOWED_HOSTS: ${MODEL_REMOTE_ALLOWED_HOSTS:-api.deepseek.com}
      MODEL_LOCAL_ALLOWED_HOSTS: ${MODEL_LOCAL_ALLOWED_HOSTS:-minimind,host.docker.internal,localhost,127.0.0.1},minimind-94m
      AIO_ENABLE_LOCAL_TEST_TOOL: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      aio-sandbox:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${AIO_WORKSPACE_HOST_PATH:?Set AIO_WORKSPACE_HOST_PATH in .env}:/workspaces
      - aio-agent-runtime-data:/app/data
      - aio-agent-traces:/app/traces
      - ${MINIMIND_WEIGHTS_HOST_PATH:-./minimind/out}:/models/minimind:ro
      - ${HF_MODELS_HOST_PATH:-./models}:/models/huggingface:ro
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request('http://127.0.0.1:8000/internal/v1/health', headers={'X-Internal-Token': os.environ['INTERNAL_SERVICE_TOKEN']});
          response = urllib.request.urlopen(request, timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  business-service:
    build:
      context: ./business-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aio_agent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aio_agent}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AGENT_SERVICE_BASE_URL: http://agent-service:8000
      BUSINESS_SERVICE_CALLBACK_BASE_URL: http://business-service:8081
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      AIO_JWT_SECRET: ${AIO_JWT_SECRET:?Set AIO_JWT_SECRET in .env}
      AIO_BOOTSTRAP_ADMIN_USERNAME: ${AIO_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AIO_BOOTSTRAP_ADMIN_PASSWORD: ${AIO_BOOTSTRAP_ADMIN_PASSWORD:?Set AIO_BOOTSTRAP_ADMIN_PASSWORD in .env}
      AIO_PUBLIC_REGISTRATION_ENABLED: ${AIO_PUBLIC_REGISTRATION_ENABLED:-false}
      AIO_REFRESH_COOKIE_SECURE: "true"
      AIO_TOKEN_TTL: ${AIO_TOKEN_TTL:-15m}
      AIO_REFRESH_TOKEN_TTL: ${AIO_REFRESH_TOKEN_TTL:-30d}
      AIO_LOGIN_ATTEMPTS_PER_MINUTE: ${AIO_LOGIN_ATTEMPTS_PER_MINUTE:-10}
      AIO_RUNS_PER_MINUTE: ${AIO_RUNS_PER_MINUTE:-20}
      AIO_DAILY_TOKEN_LIMIT: ${AIO_DAILY_TOKEN_LIMIT:-200000}
      AIO_DEEPSEEK_RUNS_PER_USER_PER_DAY: ${AIO_DEEPSEEK_RUNS_PER_USER_PER_DAY:-20}
      AIO_QUOTA_TIME_ZONE: ${AIO_QUOTA_TIME_ZONE:-Asia/Shanghai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      AIO_REDIS_ENABLED: "true"
      AIO_REDIS_KEY_PREFIX: ${AIO_REDIS_KEY_PREFIX:-aio}
      AIO_LEGACY_IMPORT_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      business-service:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ${AIO_TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backup-offsite:
    image: rclone/rclone:1.70
    profiles: [offsite-backup]
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
          rclone sync /backups "$${POSTGRES_BACKUP_REMOTE:?POSTGRES_BACKUP_REMOTE is required}" --checksum;
          sleep "$${POSTGRES_BACKUP_OFFSITE_INTERVAL_SECONDS:-3600}";
        done
    environment:
      POSTGRES_BACKUP_REMOTE: ${POSTGRES_BACKUP_REMOTE:-}
      POSTGRES_BACKUP_OFFSITE_INTERVAL_SECONDS: ${POSTGRES_BACKUP_OFFSITE_INTERVAL_SECONDS:-3600}
    volumes:
      - aio-agent-postgres-backups:/backups:ro
      - ${RCLONE_CONFIG_PATH:-./deploy/rclone.conf}:/config/rclone/rclone.conf:ro
    depends_on:
      postgres-backup:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    restart: unless-stopped
    logging: *default-logging
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - aio-agent-prometheus-data:/prometheus
    depends_on:
      business-service:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.33.1
    profiles: [observability]
    restart: unless-stopped
    logging: *default-logging
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERT_WEBHOOK_URL_FILE:-./deploy/alert-webhook-url}:/run/secrets/alert-webhook-url:ro
      - aio-agent-alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

volumes:
  aio-agent-postgres-data:
  aio-agent-postgres-backups:
  aio-agent-runtime-data:
  aio-agent-traces:
  aio-agent-redis-data:
  aio-agent-prometheus-data:
  aio-agent-alertmanager-data:
