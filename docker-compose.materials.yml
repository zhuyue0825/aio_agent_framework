# Optional phase-one materials integration, layered over docker-compose.yml.
services:
  agent-service:
    environment:
      RAG_EMBEDDING_ENV_FILE: /run/rag/embedding.env
      RAG_CONTROL_URL: http://business-service:8081
    volumes:
      - ${CODEX_DATA_PATH:-../codex_data}/embedding.env:/run/rag/embedding.env:ro
  business-service:
    environment:
      AIO_ATTACHMENT_DIR: /app/attachments
      RAG_DB_URL: jdbc:postgresql://host.docker.internal:5433/rag_lab?connectTimeout=5&socketTimeout=15
      RAG_DB_ENV_FILE: /run/rag/postgres.env
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 5MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 6MB
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${CODEX_DATA_PATH:-../codex_data}/attachments:/app/attachments
      - ${CODEX_DATA_PATH:-../codex_data}/rag-postgres.env:/run/rag/postgres.env:ro
