user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_trace_id $trace_id {
        "~^[A-Za-z0-9_-]{8,100}$" $http_x_trace_id;
        default $request_id;
    }

    log_format structured escape=json
        '{"timestamp":"$time_iso8601",'
        '"level":"INFO",'
        '"service":"aio-agent-frontend",'
        '"trace_id":"$trace_id",'
        '"logger":"nginx.access",'
        '"message":"request_completed",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"duration_seconds":$request_time,'
        '"remote_addr":"$remote_addr"}';

    access_log /dev/stdout structured;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    upstream business_service {
        server business-service:8081;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://business_service;
            proxy_http_version 1.1;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Trace-Id $trace_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            expires -1;
        }
    }
}
